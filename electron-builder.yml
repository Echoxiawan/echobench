appId: com.echobench.app
productName: EchoBench
copyright: Copyright © 2026 EchoBench contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-server/**
  - dist-desktop/**
  - package.json
  - "!**/*.map"

asar: false

extraResources:
  - from: resources/scrcpy-server
    to: scrcpy-server
  - from: resources/jre
    to: jre

win:
  target: nsis
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  notarize: false
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
