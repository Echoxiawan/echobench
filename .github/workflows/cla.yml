name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  remind:
    name: Remind contributor to sign CLA
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Comment with the fixed signature text
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const marker = '<!-- echobench-cla-reminder -->';
            const phrase = 'I have read the EchoBench CLA and I hereby sign it.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const signed = comments.some((comment) => {
              if (comment.user?.login?.toLowerCase() !== author.toLowerCase()) return false;
              const body = (comment.body ?? '').toLowerCase();
              return body.includes(phrase.toLowerCase()) && body.includes(`@${author.toLowerCase()}`);
            });
            const base = `https://github.com/${owner}/${repo}/blob/${context.payload.repository.default_branch}`;
            const claUrl = `${base}/CLA.md`;
            const cclaUrl = `${base}/CCLA.md`;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'CLA',
              state: signed ? 'success' : 'pending',
              description: signed ? 'CLA signed in PR comment' : 'Waiting for CLA signature comment',
              target_url: claUrl,
            });

            if (signed) return;
            if (comments.some((comment) => (comment.body ?? '').includes(marker))) return;

            const body = [
              marker,
              '## Action required: sign the EchoBench CLA',
              '',
              `@${author} This comment is an instruction, not a CLA signature. Do not reply to this comment.`,
              '',
              'Create a **new comment** on this PR and paste exactly this text:',
              '',
              '```text',
              phrase,
              '',
              `GitHub username: @${author}`,
              'Date: YYYY-MM-DD',
              '```',
              '',
              '请新开一条 PR 评论并粘贴上面的固定文案；不要直接回复这条机器人评论。',
              '',
              `- Individual CLA: ${claUrl}`,
              `- Corporate contribution: ${cclaUrl} (the company signs first and lists you in Schedule A)`,
              '',
              'After you post the new comment, the CLA status updates automatically. Checking the PR template box is not a signature.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body,
            });

  verify:
    name: Record CLA signature
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Verify signature comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue.number,
            });
            const author = pr.user.login;
            if (comment.user.login.toLowerCase() !== author.toLowerCase()) return;

            const phrase = 'I have read the EchoBench CLA and I hereby sign it.';
            const body = (comment.body ?? '').toLowerCase();
            if (!body.includes(phrase.toLowerCase()) || !body.includes(`@${author.toLowerCase()}`)) return;

            const base = `https://github.com/${owner}/${repo}/blob/${context.payload.repository.default_branch}`;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'CLA',
              state: 'success', description: 'CLA signed in PR comment',
              target_url: `${base}/CLA.md`,
            });

            const marker = '<!-- echobench-cla-signed -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            if (comments.some((item) => (item.body ?? '').includes(marker))) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `${marker}\nCLA signature recorded for @${author}.`,
            });
